<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Garlic butter rice with soft herbs | Slow Kitchen</title>
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#0a0e17;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
  /* Layout: centered card over a scattered "ingredients" canvas, with a soft clearing behind the text */
  :root {
    --bg: #0a0e17; --fg: #ffffff; --muted: #aaa; --btn: #2a2a2e; --btn-hover: #3a3a3e; --btn-fg: #fff;
    --clear: rgba(10, 14, 23, 0.75);
    color-scheme: light;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
    position: relative;
    overflow-x: hidden;
  }
  #bg {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }
  .veil {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse 70% 50% at 50% 45%, rgba(10,14,23,0.55) 0%, rgba(10,14,23,0.25) 50%, rgba(10,14,23,0) 80%);
  }
  .container { max-width: 480px; position: relative; z-index: 2; }
  .avatar {
    display: block; width: 150px; height: 150px; margin: 0 auto 1.25rem;
    border-radius: 50%; object-fit: cover;
    border: 4px solid #fff; box-shadow: 0 6px 20px rgba(60, 45, 20, 0.18);
  }
  h1 {
    font-size: 2.5rem;
    font-weight: 600;
    margin-bottom: 0.75rem;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }
  .subtitle { font-size: 1.1rem; color: transparent; margin-bottom: 2.5rem; user-select: none; }
  .subtitle {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  h1 { margin-bottom: 1.5rem; }
  .name-link { color: inherit; text-decoration: none; }
  .name-link:focus-visible { outline: 3px solid var(--muted); outline-offset: 4px; border-radius: 6px; }
  .cta {
    display: inline-block;
    background: #2c2c30;
    color: #fff;
    text-decoration: none;
    padding: 1.05rem 2.8rem;
    border-radius: 999px;
    font-weight: 500;
    font-size: 1.05rem;
    transition: transform 0.15s ease, background 0.15s ease;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  .cta:hover { background: var(--btn-hover); transform: translateY(-2px); }
  .cta:focus-visible { outline: 3px solid var(--muted); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .cta { transition: none; } .cta:hover { transform: none; } }

  .verified {
    display: inline-block;
    background: #1d9bf0;
    color: #fff;
    border-radius: 50%;
    width: 1.05em;
    height: 1.05em;
    font-size: 0.42em;
    line-height: 1.05em;
    text-align: center;
    vertical-align: middle;
    margin-left: 0.2em;
    font-weight: 700;
    box-shadow: 0 1px 2px rgba(0,0,0,0.15);
  }
</style>
</head>
<body>

<canvas id="bg" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>

<div class="container">
  <img class="avatar" src="avatar.jpg" onerror="this.style.display='none'" alt="Brendon Islinger" width="150" height="150">
  <h1>Brendon Islinger <span class="verified" aria-label="Verified">✓</span></h1>
  <p class="subtitle">Garlic butter rice with soft herbs | Slow Kitchen</p>
  <a class="cta" href="https://linktr.ee/Slinger.fit" onclick="window.location.href='https://linktr.ee/Slinger.fit'; return false;">Click Here</a>
</div>

<script>
(function () {
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');

  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function star(x, y, s, a, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(a);
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const angle = (i * 4 * Math.PI) / 5 - Math.PI / 2;
      const r = i % 2 === 0 ? 10 * s : 4 * s;
      const px = Math.cos(angle) * r;
      const py = Math.sin(angle) * r;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.75;
    ctx.fill();
    ctx.restore();
  }

  function check(x, y, s, a, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(a);
    ctx.beginPath();
    ctx.moveTo(-6 * s, 0);
    ctx.lineTo(-2 * s, 4 * s);
    ctx.lineTo(7 * s, -5 * s);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.2 * s;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.globalAlpha = 0.65;
    ctx.stroke();
    ctx.restore();
  }

  function arrow(x, y, s, a, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(a);
    ctx.beginPath();
    ctx.moveTo(-10 * s, 0);
    ctx.lineTo(8 * s, 0);
    ctx.lineTo(3 * s, -4 * s);
    ctx.moveTo(8 * s, 0);
    ctx.lineTo(3 * s, 4 * s);
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.6 * s;
    ctx.lineCap = 'round';
    ctx.globalAlpha = 0.45;
    ctx.stroke();
    ctx.restore();
  }

  function plus(x, y, s, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    ctx.moveTo(-5 * s, 0);
    ctx.lineTo(5 * s, 0);
    ctx.moveTo(0, -5 * s);
    ctx.lineTo(0, 5 * s);
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.4 * s;
    ctx.lineCap = 'round';
    ctx.globalAlpha = 0.4;
    ctx.stroke();
    ctx.restore();
  }

  function sparkle(x, y, s, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    ctx.moveTo(0, -8 * s);
    ctx.lineTo(1.5 * s, -1.5 * s);
    ctx.lineTo(8 * s, 0);
    ctx.lineTo(1.5 * s, 1.5 * s);
    ctx.lineTo(0, 8 * s);
    ctx.lineTo(-1.5 * s, 1.5 * s);
    ctx.lineTo(-8 * s, 0);
    ctx.lineTo(-1.5 * s, -1.5 * s);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.7;
    ctx.fill();
    ctx.restore();
  }

  function crown(x, y, s, a) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(a);
    ctx.beginPath();
    ctx.moveTo(-10 * s, 4 * s);
    ctx.lineTo(-8 * s, -6 * s);
    ctx.lineTo(-4 * s, -2 * s);
    ctx.lineTo(0, -8 * s);
    ctx.lineTo(4 * s, -2 * s);
    ctx.lineTo(8 * s, -6 * s);
    ctx.lineTo(10 * s, 4 * s);
    ctx.closePath();
    ctx.fillStyle = '#d4af37';
    ctx.globalAlpha = 0.7;
    ctx.fill();
    ctx.restore();
  }

  function draw() {
    const dpr = window.devicePixelRatio || 1;
    const w = window.innerWidth, h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    // Dark gradient background (blue-black left to deep green-black right)
    const g = ctx.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, '#0c1528');
    g.addColorStop(0.45, '#0a101c');
    g.addColorStop(1, '#0d1a14');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);

    const rand = rng(1337);
    const area = w * h;

    const counts = {
      stars: Math.round(area / 28000),
      checks: Math.round(area / 45000),
      arrows: Math.round(area / 55000),
      pluses: Math.round(area / 40000),
      sparkles: Math.round(area / 35000),
      crowns: Math.max(1, Math.round(area / 180000))
    };

    const colors = ['#f5d76e', '#ffffff', '#c9d1d9', '#e6c200', '#a8b2c1'];

    for (let i = 0; i < counts.stars; i++) {
      star(rand() * w, rand() * h, 0.6 + rand() * 0.7, rand() * Math.PI * 2, colors[Math.floor(rand() * 3)]);
    }
    for (let i = 0; i < counts.checks; i++) {
      check(rand() * w, rand() * h, 0.7 + rand() * 0.6, rand() * Math.PI * 2, '#d0d7de');
    }
    for (let i = 0; i < counts.arrows; i++) {
      arrow(rand() * w, rand() * h, 0.8 + rand() * 0.5, rand() * Math.PI * 2, '#8b949e');
    }
    for (let i = 0; i < counts.pluses; i++) {
      plus(rand() * w, rand() * h, 0.6 + rand() * 0.5, '#6e7681');
    }
    for (let i = 0; i < counts.sparkles; i++) {
      sparkle(rand() * w, rand() * h, 0.5 + rand() * 0.5, colors[Math.floor(rand() * colors.length)]);
    }
    for (let i = 0; i < counts.crowns; i++) {
      crown(rand() * w, rand() * h, 0.8 + rand() * 0.4, (rand() - 0.5) * 0.6);
    }
  }

  let t;
  window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(draw, 120); });
  draw();
})();
</script>

</body>
</html>
