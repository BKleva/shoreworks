# Twin Cleans — standalone static site (own Netlify project)
[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Pretty URL for the admin panel
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
