[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Clean URLs — serve .html files at path without extension
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/spotlight-success"
  to = "/spotlight-success.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/forum"
  to = "/forum.html"
  status = 200

# Proxy the Review Collector app so it lives under this domain at /reviews,
# while it stays deployed as its own separate Netlify site/functions.
[[redirects]]
  from = "/reviews-api/*"
  to = "https://shoreworks-review-collector.netlify.app/.netlify/functions/:splat"
  status = 200
  force = true

# Serve business logos from this domain (not the Supabase storage host) so
# review-request emails don't trip "cross-domain image" spam-filter checks.
[[redirects]]
  from = "/reviews/logo/*"
  to = "https://nnrkdxadjxadmbanwtoe.supabase.co/storage/v1/object/public/logos/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/reviews.html"
  to = "/reviews"
  status = 301
  force = true

[[redirects]]
  from = "/reviews"
  to = "https://shoreworks-review-collector.netlify.app/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/reviews/*"
  to = "https://shoreworks-review-collector.netlify.app/:splat"
  status = 200
  force = true
