<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Staff Portal | ScottiCuts</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin">

<!-- login -->
<main class="login" id="login">
  <form class="login-card" id="loginForm">
    <img src="images/pole-light.png" alt="" width="30" height="120">
    <h1>Staff Portal</h1>
    <p class="sub">ScottiCuts bookings &amp; calendar</p>
    <div class="field"><label for="u">Username</label><input id="u" autocomplete="username" required></div>
    <div class="field"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required></div>
    <p class="err" id="loginErr" role="alert"></p>
    <button class="btn" type="submit">Log in</button>
    <a class="back" href="/">← Back to site</a>
  </form>
</main>

<!-- app -->
<div id="app" hidden>
  <header class="bar">
    <a class="brand" href="/"><img src="images/pole-light.png" alt="" width="20" height="80"><span>Scotti<em>Cuts</em></span></a>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="calendar" class="on">Calendar</button>
      <button role="tab" data-tab="upcoming">Upcoming</button>
      <button role="tab" data-tab="team">Team</button>
      <button role="tab" data-tab="settings">Settings</button>
    </nav>
    <button class="link-btn" id="logout" type="button">Log out</button>
  </header>

  <main class="view">
    <section id="tab-calendar">
      <div class="toolbar">
        <div class="seg">
          <button class="btn btn-ghost btn-sm" id="prev" aria-label="Previous day">‹</button>
          <button class="btn btn-ghost btn-sm" id="today">Today</button>
          <button class="btn btn-ghost btn-sm" id="next" aria-label="Next day">›</button>
        </div>
        <input type="date" id="pick" aria-label="Jump to date">
        <h2 id="dayTitle"></h2>
        <div class="seg right">
          <button class="btn btn-sm" id="addBtn">+ Booking</button>
          <button class="btn btn-ghost btn-sm" id="blockBtn">Block time</button>
          <button class="btn btn-ghost btn-sm" id="closeBtn">Close day</button>
        </div>
      </div>
      <div class="week" id="week"></div>
      <div class="banner" id="banner" hidden></div>
      <div class="grid-wrap"><div class="grid" id="grid"></div></div>
    </section>

    <section id="tab-upcoming" hidden>
      <h2 class="h">Next 14 days</h2>
      <div id="upcoming"></div>
    </section>

    <section id="tab-team" hidden>
      <div class="toolbar"><h2 class="h" style="margin:0;flex:1">Barbers</h2><button class="btn btn-sm" id="addEmp">+ Add barber</button></div>
      <p class="hint" style="color:var(--mute);margin-bottom:16px">Each barber gets their own login at <b>/staff</b> to edit their profile and upload portfolio photos. Profiles show on the website’s “Meet the barbers” section.</p>
      <div id="teamList"></div>
    </section>

    <section id="tab-settings" hidden>
      <h2 class="h">Services &amp; prices</h2>
      <div id="svcEditor"></div>
      <h2 class="h">Hours</h2>
      <div id="hoursEditor"></div>
      <h2 class="h">Booking rules</h2>
      <div class="rules" id="rules"></div>
      <div class="save-row"><button class="btn" id="saveCfg">Save changes</button><span id="saveMsg" class="msg"></span></div>
    </section>
  </main>
</div>

<dialog id="modal"><form method="dialog" id="modalBody"></form></dialog>
<div class="toast" id="toast" role="status"></div>

<script src="admin.js"></script>
</body>
</html>
