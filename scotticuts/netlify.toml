# ScottiCuts — standalone static site + booking API (own Netlify project)
[build]
  publish = "."
  command = ""

[build.environment]
  # @netlify/blobs 11 needs Node >= 22
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/manage"
  to = "/manage.html"
  status = 200

[[redirects]]
  from = "/staff"
  to = "/staff.html"
  status = 200
