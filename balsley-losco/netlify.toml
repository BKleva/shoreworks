# Balsley Losco Real Estate — static site (built by tools/build.py into /public)
[build]
  publish = "public"
  command = "python tools/build.py"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Old blhomes.com URLs -> new equivalents (preserve SEO equity at cutover)
[[redirects]]
  from = "/agents.php"
  to = "/agents/"
  status = 301
